<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aegis — AI-Powered Income Insurance for Gig Workers" />
    <meta name="theme-color" content="#6AA1F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #initial-loading {
        position: fixed;
        inset: 0;
        background: #F8FAFC;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #64748B;
        flex-direction: column;
        gap: 16px;
      }
      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid #E2E8F0;
        border-top-color: #3B82F6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <title>Aegis Insurance</title>
  </head>
  <body>
    <!-- Initial Loading State -->
    <div id="initial-loading">
      <div class="loader"></div>
      <div class="loading-text">Starting Aegis Portal...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
