{% extends "base.html" %}
{% block title %}Login — GuideWire Cloud{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <i class="fa-solid fa-shield-halved fa-2x"></i>
    <h2>Welcome back</h2>
    <p>Sign in to your GuideWire account</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="your@email.com" required autofocus />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Your password" required />
    </div>

    <div class="form-group form-check">
      <label><input type="checkbox" name="remember" /> Remember me</label>
    </div>

    <button type="submit" class="btn-primary btn-full">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="auth-hint">
    <small>
      <strong>Demo admin:</strong> admin@guidewire.app / Admin@1234
    </small>
  </div>

  <p class="auth-switch">Don't have an account?
    <a href="{{ url_for('auth.register') }}">Register now</a>
  </p>
</div>
{% endblock %}
