{% extends "base.html" %}
{% block title %}Register — GuideWire Cloud{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <i class="fa-solid fa-user-plus fa-2x"></i>
    <h2>Create your account</h2>
    <p>Join GuideWire and get instant income protection</p>
  </div>

  <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}" />

    <div class="form-row">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="full_name" value="{{ form_data.get('full_name','') }}"
               placeholder="Ravi Kumar" required />
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" value="{{ form_data.get('email','') }}"
               placeholder="ravi@example.com" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required />
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>City *</label>
        <select name="city" required>
          <option value="">— Select city —</option>
          {% for c in ['Mumbai','Delhi','Chennai','Kolkata','Bangalore','Hyderabad','Pune','Ahmedabad','Jaipur'] %}
            <option value="{{ c }}" {% if form_data.get('city') == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone" value="{{ form_data.get('phone','') }}"
               placeholder="+91 98765 43210" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Vehicle Type</label>
        <select name="vehicle_type">
          <option value="bicycle" {% if form_data.get('vehicle_type','bicycle')=='bicycle' %}selected{% endif %}>🚲 Bicycle</option>
          <option value="motorcycle" {% if form_data.get('vehicle_type')=='motorcycle' %}selected{% endif %}>🏍️ Motorcycle</option>
          <option value="car" {% if form_data.get('vehicle_type')=='car' %}selected{% endif %}>🚗 Car</option>
          <option value="on_foot" {% if form_data.get('vehicle_type')=='on_foot' %}selected{% endif %}>🚶 On Foot</option>
        </select>
      </div>
      <div class="form-group">
        <label>Work Area / Zone</label>
        <input type="text" name="work_area" value="{{ form_data.get('work_area','') }}"
               placeholder="e.g. Andheri West, Zone 3" />
      </div>
    </div>

    <button type="submit" class="btn-primary btn-full">
      <i class="fa-solid fa-rocket"></i> Create Account
    </button>
  </form>

  <p class="auth-switch">Already have an account?
    <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
